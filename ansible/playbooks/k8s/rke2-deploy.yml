---
- name: Deploy RKE2 cluster with Cilium
  hosts: rke2-cluster
  become: true
  gather_facts: true

  vars:
    required_kernel_modules:
      [ip_vs, ip_vs_rr, ip_vs_wrr, ip_vs_sh, nf_conntrack]

  pre_tasks:
    - name: Enable kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop: "{{ required_kernel_modules }}"
      tags: [rke2, kernel]

  roles:
    - role: rke2_cilium
      tags: [rke2, cilium]
    - role: lablabs.rke2
      tags: rke2
    - role: node_local_dns
      tags: [dns, node_local_dns]

  post_tasks:
    - name: Link kubectl into PATH on servers
      ansible.builtin.file:
        src: "{{ rke2_data_path }}/bin/kubectl"
        dest: /usr/local/bin/kubectl
        state: link
      when: inventory_hostname in groups[rke2_servers_group_name]
      tags: [rke2, kubectl]

    - name: Export KUBECONFIG for interactive shells on servers
      ansible.builtin.copy:
        dest: /etc/profile.d/rke2.sh
        content: |
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          export PATH=$PATH:{{ rke2_data_path }}/bin
        owner: root
        group: root
        mode: "0644"
      when: inventory_hostname in groups[rke2_servers_group_name]
      tags: [rke2, kubectl]

    - name: Install Cilium CLI
      ansible.builtin.include_role:
        name: rke2_cilium
        tasks_from: cilium_cli
      tags: [cilium, cilium_cli]

    - name: Verify Cilium
      ansible.builtin.include_role:
        name: rke2_cilium
        tasks_from: verify
      tags: [cilium, verify]

    - name: Look for kubectl on the Ansible controller
      ansible.builtin.command: kubectl version --client
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      register: _controller_kubectl
      when: inventory_hostname == groups[rke2_servers_group_name][0]
      tags: [rke2, kubeconfig]

    - name: Verify the downloaded kubeconfig reaches the API server
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ rke2_download_kubeconf_path }}/{{ rke2_download_kubeconf_file_name }}
        get nodes -o name
      delegate_to: localhost
      become: false
      changed_when: false
      register: _kubeconfig_nodes
      when:
        - inventory_hostname == groups[rke2_servers_group_name][0]
        - rke2_download_kubeconf | bool
        - _controller_kubectl.rc == 0
      tags: [rke2, kubeconfig]

    - name: Show nodes seen through the downloaded kubeconfig
      ansible.builtin.debug:
        var: _kubeconfig_nodes.stdout_lines
      when: _kubeconfig_nodes.stdout_lines is defined
      tags: [rke2, kubeconfig]
