---
- name: Install Cilium CLI on servers
  when:
    - inventory_hostname in groups[rke2_servers_group_name]
    - "'cilium' in rke2_cni"
    - cilium_cli_install | bool
  tags: [cilium, cilium_cli]
  block:
    - name: Set Cilium CLI artifact name
      ansible.builtin.set_fact:
        _cilium_cli_tarball: "cilium-linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz"

    - name: Check whether Cilium CLI is already at the requested version
      ansible.builtin.command: "{{ cilium_cli_install_path }}/cilium version --client"
      register: _cilium_cli_current
      changed_when: false
      failed_when: false

    - name: Install Cilium CLI
      when: cilium_cli_version | replace('v', '') not in (_cilium_cli_current.stdout | default(''))
      block:
        - name: Download Cilium CLI tarball and checksum
          ansible.builtin.get_url:
            url: "{{ cilium_cli_base_url }}/{{ cilium_cli_version }}/{{ item }}"
            dest: "/tmp/{{ item }}"
            mode: "0644"
          loop:
            - "{{ _cilium_cli_tarball }}"
            - "{{ _cilium_cli_tarball }}.sha256sum"

        - name: Verify Cilium CLI checksum
          ansible.builtin.command: "sha256sum --check /tmp/{{ _cilium_cli_tarball }}.sha256sum"
          args:
            chdir: /tmp
          changed_when: false

        - name: Extract Cilium CLI
          ansible.builtin.unarchive:
            src: "/tmp/{{ _cilium_cli_tarball }}"
            dest: "{{ cilium_cli_install_path }}"
            remote_src: true
            mode: "0755"

      always:
        - name: Remove Cilium CLI temp files
          ansible.builtin.file:
            path: "/tmp/{{ item }}"
            state: absent
          loop:
            - "{{ _cilium_cli_tarball }}"
            - "{{ _cilium_cli_tarball }}.sha256sum"
